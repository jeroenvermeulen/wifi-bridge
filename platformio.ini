; WiFi <-> Ethernet transparent bridge. Pick the environment for your board:
;   pio run -e esp32-s3-poe -t upload     ESP32-S3 PoE W5500 N16R8 board (default)
;   pio run -e lolin-s2-mini -t upload    WEMOS LOLIN S2 Mini + W5500 module
; Logs: pio device monitor
;
; Board settings (W5500 pins, SPI clock, Ethernet link mode, chip options) are
; in boards/<env>.defaults, on top of sdkconfig.defaults. To add a board, copy
; one of those files and an environment below. ESP-IDF only applies
; defaults to a fresh config: after editing them, delete sdkconfig.<env>.

[platformio]
default_envs = esp32-s3-poe

[env]
platform = espressif32@6.11.0
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:esp32-s3-poe]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;boards/esp32-s3-poe.defaults"

[env:lolin-s2-mini]
board = lolin_s2_mini
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;boards/lolin-s2-mini.defaults"
