; Finds which GPIOs the on-board W5500 is wired to.
; Build + flash: pio run -t upload ; then: pio device monitor

[env:probe]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
